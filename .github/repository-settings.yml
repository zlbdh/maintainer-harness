# Suggested public GitHub repository settings.
#
# This file is documentation for maintainers. It is not applied automatically.

name: maintainer-harness
description: Scoped change packets for agent-assisted open source maintenance.
homepage: "https://zlbdh.github.io/maintainer-harness/"
topics:
  - codex
  - maintainer-tools
  - agent-workflows
  - open-source
  - automation
  - pull-request-review
  - release-workflows
  - developer-tools
  - github-actions
  - security-tools
  - cli-tools
features:
  issues: true
  projects: false
  wiki: false
  discussions: false
branch_protection:
  default_branch: main
  require_pull_request_reviews: true
  require_status_checks:
    - validate
