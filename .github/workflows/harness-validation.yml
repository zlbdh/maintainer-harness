name: Harness validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read
  issues: read

jobs:
  validate:
    name: validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate repository metadata
        shell: pwsh
        run: ./scripts/checks/validate-repos.ps1

      - name: Verify harness structure
        shell: pwsh
        run: ./scripts/bootstrap/verify-workspace.ps1

      - name: Validate sample change packet
        shell: pwsh
        run: ./scripts/checks/validate-change.ps1 -Path examples/sample-change

      - name: Validate issue-to-review packet
        shell: pwsh
        run: ./scripts/checks/validate-change.ps1 -Path examples/issue-to-review

      - name: Validate release workflow packet
        shell: pwsh
        run: ./scripts/checks/validate-change.ps1 -Path examples/release-workflow

      - name: Exercise machine-readable checks
        shell: pwsh
        run: |
          ./scripts/checks/validate-repos.ps1 -Quiet -PassThru | ConvertTo-Json -Depth 5
          ./scripts/checks/discover-contracts.ps1 -NoReport -Quiet -PassThru | ConvertTo-Json -Depth 5
          ./scripts/checks/run-local-baseline.ps1 -SkipCommandExecution -Quiet -PassThru | ConvertTo-Json -Depth 5

      - name: Check public readiness
        shell: pwsh
        run: ./scripts/checks/check-public-ready.ps1 -SkipSensitivePattern

      - name: Check public evidence links
        shell: pwsh
        run: ./scripts/checks/check-public-evidence-links.ps1

      - name: Validate external feedback evidence
        shell: pwsh
        run: ./scripts/checks/validate-external-feedback-evidence.ps1

      - name: Exercise review demo runner
        shell: pwsh
        run: ./scripts/checks/run-review-demo.ps1 -SkipCommandExecution -PassThru | ConvertTo-Json -Depth 5

      - name: Report Codex for OSS readiness
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $readiness = ./scripts/checks/measure-application-readiness.ps1 -PassThru
          $readiness | ConvertTo-Json -Depth 8

          if ($env:GITHUB_STEP_SUMMARY) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '### Codex for OSS readiness'
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ''
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ('Score: {0}/{1}' -f $readiness.score, $readiness.target_score)
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ('Ready for form submission: {0}' -f $readiness.ready_for_form_submission)
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ''
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value 'This step reports the hard external-signal gate. A score below 90 does not fail CI.'
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ''
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '| Status | Check | Detail | Points |'
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '| --- | --- | --- | ---: |'

            foreach ($finding in $readiness.findings) {
              $detail = ([string]$finding.detail) -replace '\|', '/'
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ("| {0} | {1} | {2} | {3} |" -f $finding.status, $finding.check, $detail, $finding.points)
            }
          }

      - name: Check security posture
        shell: pwsh
        run: ./scripts/checks/check-security-posture.ps1 -SkipSensitivePattern
