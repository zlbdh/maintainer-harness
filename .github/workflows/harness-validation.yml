name: Harness validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read
  issues: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate repository metadata
        shell: pwsh
        run: ./scripts/checks/validate-repos.ps1

      - name: Verify harness structure
        shell: pwsh
        run: ./scripts/bootstrap/verify-workspace.ps1

      - name: Validate sample change packet
        shell: pwsh
        run: ./scripts/checks/validate-change.ps1 -Path examples/sample-change

      - name: Validate issue-to-review packet
        shell: pwsh
        run: ./scripts/checks/validate-change.ps1 -Path examples/issue-to-review

      - name: Validate release workflow packet
        shell: pwsh
        run: ./scripts/checks/validate-change.ps1 -Path examples/release-workflow

      - name: Exercise machine-readable checks
        shell: pwsh
        run: |
          ./scripts/checks/validate-repos.ps1 -Quiet -PassThru | ConvertTo-Json -Depth 5
          ./scripts/checks/discover-contracts.ps1 -NoReport -Quiet -PassThru | ConvertTo-Json -Depth 5
          ./scripts/checks/run-local-baseline.ps1 -SkipCommandExecution -Quiet -PassThru | ConvertTo-Json -Depth 5

      - name: Check public readiness
        shell: pwsh
        run: ./scripts/checks/check-public-ready.ps1

      - name: Check external review handoff
        shell: pwsh
        run: ./scripts/checks/check-external-review-handoff.ps1

      - name: Test reviewer outreach plan
        shell: pwsh
        run: ./scripts/checks/test-reviewer-outreach-plan.ps1

      - name: Test public discovery plan
        shell: pwsh
        run: ./scripts/checks/test-public-discovery-plan.ps1

      - name: Test Codespaces first-run handoff
        shell: pwsh
        run: ./scripts/checks/test-codespaces-first-run-handoff.ps1

      - name: Check public evidence links
        shell: pwsh
        run: ./scripts/checks/check-public-evidence-links.ps1

      - name: Validate external feedback evidence
        shell: pwsh
        run: ./scripts/checks/validate-external-feedback-evidence.ps1

      - name: Test external feedback evidence validation
        shell: pwsh
        run: ./scripts/checks/test-external-feedback-evidence-validation.ps1

      - name: Test external feedback candidate scanning
        shell: pwsh
        run: ./scripts/checks/test-external-feedback-candidates.ps1

      - name: Test public readiness observation
        shell: pwsh
        run: ./scripts/checks/test-public-readiness-observation.ps1

      - name: Test first-run report generation
        shell: pwsh
        run: ./scripts/checks/test-first-run-report.ps1

      - name: Test form submission hard gate
        shell: pwsh
        run: ./scripts/checks/test-form-submission-ready.ps1

      - name: Exercise review demo runner
        shell: pwsh
        run: ./scripts/checks/run-review-demo.ps1 -SkipCommandExecution -PassThru | ConvertTo-Json -Depth 5

      - name: Report Codex for OSS readiness
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $readiness = ./scripts/checks/measure-application-readiness.ps1 -PassThru
          $readinessJson = $readiness | ConvertTo-Json -Depth 8
          $readinessJson

          $readinessDir = Join-Path $PWD 'reports/application-audit'
          New-Item -ItemType Directory -Path $readinessDir -Force | Out-Null
          $readinessJson | Set-Content -Path (Join-Path $readinessDir 'codex-readiness.json') -Encoding utf8

          $summaryLines = @(
            '### Codex for OSS readiness',
            '',
            ('Score: {0}/{1}' -f $readiness.score, $readiness.target_score),
            ('Ready for form submission: {0}' -f $readiness.ready_for_form_submission),
            '',
            'This step reports the hard external-signal gate. A score below 90 does not fail CI.',
            '',
            '| Status | Check | Detail | Points |',
            '| --- | --- | --- | ---: |'
          )

          foreach ($finding in $readiness.findings) {
            $detail = ([string]$finding.detail) -replace '\|', '/'
            $summaryLines += ("| {0} | {1} | {2} | {3} |" -f $finding.status, $finding.check, $detail, $finding.points)
          }

          $summaryLines | Set-Content -Path (Join-Path $readinessDir 'codex-readiness.md') -Encoding utf8

          if ($env:GITHUB_STEP_SUMMARY) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summaryLines
          }

      - name: Upload Codex readiness artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: codex-readiness-${{ github.sha }}
          path: |
            reports/application-audit/codex-readiness.json
            reports/application-audit/codex-readiness.md
          if-no-files-found: error

      - name: Check security posture
        shell: pwsh
        run: ./scripts/checks/check-security-posture.ps1
