signals:
  # Record only public, reviewer-visible evidence here.
  # Supported type values:
  # - issue-comment
  # - first-run-report
  # - feedback-follow-up
  #
  # Supported status values:
  # - pending
  # - verified
  #
  # Example:
  # - id: 2026-06-03-first-run-example
  #   date: 2026-06-03
  #   type: first-run-report
  #   status: verified
  #   url: https://github.com/zlbdh/maintainer-harness/issues/6#issuecomment-example
  #   summary: Outside maintainer ran the demo and reported first-run friction.
  #
  # Safer append helper:
  #   ./scripts/checks/add-external-feedback-evidence.ps1 -Id 2026-06-03-example -Type first-run-report -Status verified -Url https://example.com/public-report -Summary 'Outside reviewer ran the demo.'
